steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'asia-south2-docker.pkg.dev/poetic-loop-471609-h3/med-backend/m-backend:latest',
      '.'
    ]

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-south2-docker.pkg.dev/poetic-loop-471609-h3/med-backend/m-backend:latest'
    ]

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'med-backend-service',
      '--image', 'asia-south2-docker.pkg.dev/poetic-loop-471609-h3/med-backend/m-backend:latest',
      '--region', 'asia-south2',
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]

images:
  - 'asia-south2-docker.pkg.dev/poetic-loop-471609-h3/med-backend/m-backend:latest'
